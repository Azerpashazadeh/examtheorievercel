name: Remove auth-guard.js from HTML Files

on:
  # İş akışını manuel olarak çalıştırmak için
  workflow_dispatch:
  # (İsteğe bağlı) Her push'ta çalışmasını isterseniz aşağıdaki satırı aktif edin:
  # push:
  #   branches: [ main ]

jobs:
  clean-files:
    runs-on: ubuntu-latest

    steps:
      # 1. Repoyu checkout et
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. PowerShell'i yükle (Ubuntu'da varsayılan olarak gelir)
      - name: Setup PowerShell
        uses: actions/setup-powershell@v1
        with:
          pwsh-version: 'latest'

      # 3. Temizleme betiğini çalıştır
      - name: Run cleanup script
        shell: pwsh
        run: ./remove-auth-guard.ps1

      # 4. Değişiklikleri GitHub'a geri gönder
      - name: Commit and push changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git diff --staged --quiet || git commit -m "chore: auth-guard.js referansları temizlendi"
          git push